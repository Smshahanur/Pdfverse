<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SMLOOP Admin</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

body{
  background:#f4f5fb;
  color:#222;
}

#loginPage{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.login-box{
  width:100%;
  max-width:400px;
  background:white;
  padding:30px;
  border-radius:20px;
  box-shadow:0 10px 30px rgba(0,0,0,.12);
}

.login-box h1{
  color:#5b43b5;
  text-align:center;
  margin-bottom:10px;
}

.login-box p{
  text-align:center;
  color:#777;
  margin-bottom:25px;
}

input,textarea{
  width:100%;
  padding:14px;
  border:1px solid #ddd;
  border-radius:10px;
  margin-bottom:15px;
  font-size:16px;
}

textarea{
  min-height:100px;
  resize:vertical;
}

button{
  border:none;
  padding:13px 18px;
  border-radius:10px;
  cursor:pointer;
  font-size:15px;
}

.primary{
  background:#5b43b5;
  color:white;
  width:100%;
}

.danger{
  background:#e74c3c;
  color:white;
}

.edit{
  background:#3498db;
  color:white;
}

.logout{
  background:#333;
  color:white;
  width:auto;
}

#adminPage{
  display:none;
  min-height:100vh;
}

header{
  background:white;
  padding:15px 20px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  box-shadow:0 2px 10px rgba(0,0,0,.08);
}

header h2{
  color:#5b43b5;
}

.container{
  max-width:1100px;
  margin:30px auto;
  padding:0 15px;
}

.panel{
  background:white;
  padding:20px;
  border-radius:18px;
  margin-bottom:25px;
  box-shadow:0 5px 20px rgba(0,0,0,.06);
}

.panel h3{
  margin-bottom:20px;
}

.tool-card{
  border:1px solid #e5e5e5;
  padding:15px;
  border-radius:12px;
  margin-bottom:12px;
}

.tool-card h4{
  margin-bottom:8px;
  font-size:18px;
}

.tool-card p{
  color:#666;
  margin-bottom:12px;
}

.actions{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
}

#message{
  margin-top:12px;
  text-align:center;
  font-weight:bold;
}

@media(max-width:600px){
  header h2{
    font-size:20px;
  }
}
</style>
</head>

<body>

<div id="loginPage">
  <div class="login-box">
    <h1>SMLOOP</h1>
    <p>Admin Panel</p>

    <input type="email" id="email" placeholder="Admin email">
    <input type="password" id="password" placeholder="Password">

    <button class="primary" onclick="login()">Login</button>

    <div id="message"></div>
  </div>
</div>

<div id="adminPage">

<header>
  <h2>SMLOOP Admin</h2>
  <button class="logout" onclick="logout()">Logout</button>
</header>

<div class="container">

  <div class="panel">
    <h3>Add / Edit Tool</h3>

    <input type="hidden" id="toolId">

    <input type="text" id="name" placeholder="Tool name">

    <textarea id="description"
      placeholder="Tool description"></textarea>

    <input type="text" id="icon"
      placeholder="Emoji icon (Example: 🔗)">

    <input type="text" id="category"
      placeholder="Category (Example: PDF Tools)">

    <button class="primary" onclick="saveTool()">
      Save Tool
    </button>

    <div id="adminMessage"></div>
  </div>

  <div class="panel">
    <h3>All Tools</h3>
    <div id="toolsList">Loading...</div>
  </div>

</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL = "YOUR_SUPABASE_URL";
const SUPABASE_KEY = "YOUR_PUBLISHABLE_KEY";

const supabaseClient =
  supabase.createClient(SUPABASE_URL, SUPABASE_KEY);


async function checkUser(){

  const {
    data:{session}
  } = await supabaseClient.auth.getSession();

  if(session){

    document.getElementById("loginPage").style.display="none";
    document.getElementById("adminPage").style.display="block";

    loadTools();

  }else{

    document.getElementById("loginPage").style.display="flex";
    document.getElementById("adminPage").style.display="none";

  }
}


async function login(){

  const email =
    document.getElementById("email").value.trim();

  const password =
    document.getElementById("password").value;

  document.getElementById("message").innerText =
    "Logging in...";

  const {error} =
    await supabaseClient.auth.signInWithPassword({
      email,
      password
    });

  if(error){

    document.getElementById("message").innerText =
      error.message;

    return;
  }

  document.getElementById("message").innerText =
    "Login successful";

  checkUser();
}


async function logout(){

  await supabaseClient.auth.signOut();

  location.reload();
}


async function loadTools(){

  const {data,error} =
    await supabaseClient
      .from("tools")
      .select("*")
      .order("id");

  const list =
    document.getElementById("toolsList");

  if(error){

    list.innerHTML =
      "<p>Failed to load tools: "
      + error.message +
      "</p>";

    return;
  }

  if(!data || data.length === 0){

    list.innerHTML =
      "<p>No tools found.</p>";

    return;
  }

  list.innerHTML = "";

  data.forEach(tool => {

    const card =
      document.createElement("div");

    card.className = "tool-card";

    card.innerHTML = `

      <h4>${tool.icon || "🔧"} ${tool.name}</h4>

      <p>${tool.description || ""}</p>

      <div class="actions">

        <button class="edit"
          onclick="editTool(${tool.id}, '${encodeURIComponent(tool.name || "")}', '${encodeURIComponent(tool.description || "")}', '${encodeURIComponent(tool.icon || "")}', '${encodeURIComponent(tool.category || "")}')">
          Edit
        </button>

        <button class="danger"
          onclick="deleteTool(${tool.id})">
          Delete
        </button>

      </div>

    `;

    list.appendChild(card);

  });

}


function editTool(
  id,
  name,
  description,
  icon,
  category
){

  document.getElementById("toolId").value=id;

  document.getElementById("name").value=
    decodeURIComponent(name);

  document.getElementById("description").value=
    decodeURIComponent(description);

  document.getElementById("icon").value=
    decodeURIComponent(icon);

  document.getElementById("category").value=
    decodeURIComponent(category);

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}


async function saveTool(){

  const id =
    document.getElementById("toolId").value;

  const tool = {

    name:
      document.getElementById("name").value.trim(),

    description:
      document.getElementById("description").value.trim(),

    icon:
      document.getElementById("icon").value.trim(),

    category:
      document.getElementById("category").value.trim()

  };


  if(!tool.name){

    alert("Please enter a tool name.");

    return;

  }


  let result;


  if(id){

    result =
      await supabaseClient
        .from("tools")
        .update(tool)
        .eq("id",id);

  }else{

    result =
      await supabaseClient
        .from("tools")
        .insert([tool]);

  }


  if(result.error){

    document.getElementById("adminMessage").innerText =
      result.error.message;

    return;

  }


  document.getElementById("adminMessage").innerText =
    "Saved successfully!";

  document.getElementById("toolId").value="";
  document.getElementById("name").value="";
  document.getElementById("description").value="";
  document.getElementById("icon").value="";
  document.getElementById("category").value="";

  loadTools();

}


async function deleteTool(id){

  if(!confirm("Delete this tool?")){
    return;
  }

  const {error} =
    await supabaseClient
      .from("tools")
      .delete()
      .eq("id",id);

  if(error){

    alert(error.message);

    return;

  }

  loadTools();

}


checkUser();

</script>

</body>
</html>
